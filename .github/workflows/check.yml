name: Check archive proxy
on: [pull_request, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx wrangler types --check
      - run: npm run deploy:dry-run
      - run: npx wrangler deploy --env dev --dry-run
    env:
      WRANGLER_SEND_METRICS: 'false'
